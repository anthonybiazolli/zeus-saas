version: '3.8'

services:
  api:
    build: .
    container_name: zeusia_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: zeusia_postgres
    environment:
      POSTGRES_USER: zeusia
      POSTGRES_PASSWORD: zeusia_password
      POSTGRES_DB: zeusia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zeusia_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: